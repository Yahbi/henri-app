# Oklahoma City, OK — Accela ACA scrape (Phase 4).
# WARNING: gis.okc.gov is behind an Incapsula bot wall. The ACA
# tenant at access.okc.gov/aca/ is a separate hostname and may or
# may not share the wall.
#
# Two paths to try in order:
#   1. Direct ACA scrape — set cloudflare:true to enable Camoufox's
#      anti-bot evasion. Most likely sufficient.
#   2. If still 403/blocked, the harder path is to scrape the
#      Incapsula-fronted gis.okc.gov instead with stronger evasion.

loader: accela
name: OKLAHOMA-CITY-OK
city: Oklahoma City
state: OK
status: unverified

base_url: https://access.okc.gov/aca
search_path: /Cap/CapHome.aspx?module=Building
module: Building
date_range_days: 7
max_pages: 100
cloudflare: true                # Try with anti-bot evasion ON

field_from: ctl00_PlaceHolderMain_generalSearchForm_txtGSStartDate
field_to: ctl00_PlaceHolderMain_generalSearchForm_txtGSEndDate
field_submit: ctl00_PlaceHolderMain_btnNewSearch

result_table_selector: '#ctl00_PlaceHolderMain_dgvPermitList'
next_page_selector: 'a.aca_next, a[id$="lnkNext"]'

fields:
  permit_no:    0
  issued_date:  2
  record_type:  3
  description:  4
  address:      5
  status:       6
