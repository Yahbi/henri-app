# Las Vegas, NV — Accela ACA scrape (Phase 4).
# ~30-40k/yr. Replaces the field-stripped CLV ArcGIS Open Data feed.

loader: accela
name: LAS-VEGAS-NV
city: Las Vegas
state: NV
status: unverified

base_url: https://aca-prod.accela.com/lasvegas
search_path: /Cap/CapHome.aspx?module=Building
module: Building
date_range_days: 7
max_pages: 100
cloudflare: false

field_from: ctl00_PlaceHolderMain_generalSearchForm_txtGSStartDate
field_to: ctl00_PlaceHolderMain_generalSearchForm_txtGSEndDate
field_submit: ctl00_PlaceHolderMain_btnNewSearch

result_table_selector: '#ctl00_PlaceHolderMain_dgvPermitList'
next_page_selector: 'a.aca_next, a[id$="lnkNext"]'

fields:
  permit_no:    0
  issued_date:  2
  record_type:  3
  description:  4
  address:      5
  status:       6
