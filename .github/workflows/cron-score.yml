# Score cron — every 20 minutes.
#
# WHY THIS EXISTS: the external scheduler (Hetzner crontab curling the Vercel
# cron endpoints) went silent on 2026-05-14 and the lead pipeline froze:
# 166k permits piled up unscored and zero leads were created for 3+ weeks.
# vercel.json can only hold 2 native crons on the Hobby plan, so GitHub
# Actions is the scheduler of record for everything else (see cron-fleet.yml).
#
# Score runs aggressively (every 20 min, 1,000 permits per run = up to
# 72k/day) until the backlog drains, after which each run is a cheap no-op
# rotator tick. The endpoint is idempotent and CRON_SECRET-gated.
#
# NOTE: schedule triggers only fire from the default branch. Requires the
# repository secret CRON_SECRET (same value as the Vercel env var).

name: cron-score

on:
  # ── SCHEDULE PAUSED 2026-08-05 — Supabase Disk IO Budget exhausted ──
  #
  # Supabase emailed on 2026-08-04 18:05 UTC: "Your project is depleting its
  # Disk IO Budget... Your instance may become unresponsive." It then became
  # exactly that. PostgREST returns Cloudflare 522 on every request while
  # storage and auth answer normally, and Postgres logs show WAL archiving
  # failing repeatedly (`archive command failed with exit code 1`), so no WAL
  # is being recycled — every checkpoint reports "0 removed, 0 recycled".
  #
  # THIS FLEET IS NOW PART OF THE PROBLEM. The run history is unambiguous:
  #   runs #1045-#1057   4-12 SECONDS each   (healthy)
  #   run  #1058         15m 10s             (the wall)
  #   runs #1059-#1068   21-30 MINUTES each  (all failing)
  # Each failing run holds the database for 20-30 minutes with curl retries
  # (--max-time 290 --retry 2) and the next run starts 30 minutes later, so
  # the load is effectively continuous on an instance that has no IO budget
  # left to serve it. It cannot drain its backlog while this keeps firing.
  #
  # workflow_dispatch is intentionally KEPT so any endpoint can still be run
  # by hand for a smoke test.
  #
  # RE-ENABLE once the instance is healthy — uncomment the schedule block.
  # Verify first: a PostgREST read should return 200 in well under a second,
  # and the Disk IO Budget chart in the Supabase dashboard should be
  # recovering rather than pinned at zero. The durable fix is the compute
  # add-on upgrade Supabase recommends in that email; re-enabling the fleet
  # on the current tier will most likely reproduce this.
  # schedule:
  #   - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      # Drain loop (2026-06-10): GitHub throttles scheduled workflows hard
      # on this repo (observed 2-6 fires/day despite */20), so each run
      # that DOES fire drains as much backlog as it can: call the endpoint
      # repeatedly until a batch scores 0 (queue empty) or ~22 min elapse.
      # Each call is an independent ~1k-permit batch on the Vercel side.
      - name: Drain /api/cron/score
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 1320 ))
          runs=0; fails=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
              --max-time 290 --retry 1 --retry-delay 5 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://meethenri.com/api/cron/score") || code="000"
            runs=$((runs+1))
            scored=$(python3 -c "import json;print(json.load(open('/tmp/body.json')).get('summary',{}).get('scored',-1))" 2>/dev/null || echo "-1")
            echo "batch $runs: HTTP $code scored=$scored"
            if [ "$code" != "200" ]; then
              fails=$((fails+1))
              [ "$fails" -ge 3 ] && { echo "::error::3 consecutive failures"; exit 1; }
              sleep 20
              continue
            fi
            fails=0
            [ "$scored" = "0" ] && { echo "Queue empty."; break; }
            sleep 3
          done
          echo "Drained $runs batches."
