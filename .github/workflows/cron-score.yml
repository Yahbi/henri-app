# Score cron — every 20 minutes.
#
# WHY THIS EXISTS: the external scheduler (Hetzner crontab curling the Vercel
# cron endpoints) went silent on 2026-05-14 and the lead pipeline froze:
# 166k permits piled up unscored and zero leads were created for 3+ weeks.
# vercel.json can only hold 2 native crons on the Hobby plan, so GitHub
# Actions is the scheduler of record for everything else (see cron-fleet.yml).
#
# Score runs aggressively (every 20 min, 1,000 permits per run = up to
# 72k/day) until the backlog drains, after which each run is a cheap no-op
# rotator tick. The endpoint is idempotent and CRON_SECRET-gated.
#
# NOTE: schedule triggers only fire from the default branch. Requires the
# repository secret CRON_SECRET (same value as the Vercel env var).

name: cron-score

on:
  # 2026-08-05 incident, kept here because the shape of it is easy to repeat:
  # Supabase exhausted its Disk IO Budget ("Your instance may become
  # unresponsive" — their words, emailed 18:05 UTC 08-04) and every endpoint
  # began hanging rather than failing. With --max-time 290 --retry 2 per
  # endpoint, one run held the database for 20-30 minutes, and the next run
  # started 30 minutes later, so the load was effectively continuous on an
  # instance with no IO left. The run history shows it exactly: #1045-#1057
  # took 4-12 SECONDS, #1058 took 15m, #1059-#1068 took 21-30m and all failed.
  # The scheduler had become the reason the database could not recover.
  #
  # The schedules below stay ON. The fix is the circuit breaker in the run
  # step: it probes /api/health first and exits 0 without firing anything if
  # the backend is unhealthy, so a run during an outage costs ~25 seconds
  # instead of half an hour. That is strictly better than pausing, which
  # needs a human to remember to switch it back on; this resumes by itself.
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      # Drain loop (2026-06-10): GitHub throttles scheduled workflows hard
      # on this repo (observed 2-6 fires/day despite */20), so each run
      # that DOES fire drains as much backlog as it can: call the endpoint
      # repeatedly until a batch scores 0 (queue empty) or ~22 min elapse.
      # Each call is an independent ~1k-permit batch on the Vercel side.
      - name: Drain /api/cron/score
        run: |
          set -uo pipefail

          # ── CIRCUIT BREAKER (added 2026-08-05) ─────────────────────────
          # See cron-fleet.yml for the full incident write-up. Short version:
          # when Supabase exhausted its Disk IO Budget, every request hung
          # instead of failing, so each scheduled run held the database for
          # 20-30 minutes and the next run started before it finished. The
          # schedulers became the reason the database could not recover.
          #
          # /api/health exercises the app -> database path with an ESTIMATED
          # head count (pg_class.reltuples, not a scan) and returns 503 ONLY
          # when the database is down — degraded auxiliary services still
          # return 200, so this cannot false-trip on an unset optional env
          # var and silently stop the drain forever.
          #
          # exit 0 rather than 1: "the database is down" is not an actionable
          # workflow failure, and one red run every 20 minutes buries the
          # alerts that ARE actionable.
          HEALTH_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            --max-time 25 \
            "https://meethenri.com/api/health" 2>/dev/null) || HEALTH_CODE="000"
          echo "health probe -> HTTP $HEALTH_CODE"
          if [ "$HEALTH_CODE" != "200" ]; then
            echo "::warning::Backend unhealthy (HTTP $HEALTH_CODE) — draining nothing this run."
            {
              echo "### skipped — backend unhealthy"
              echo ""
              echo "Health probe returned **HTTP $HEALTH_CODE**. Nothing was fired."
              echo "This is the circuit breaker, not a cron bug."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          deadline=$(( $(date +%s) + 1320 ))
          runs=0; fails=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
              --max-time 290 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://meethenri.com/api/cron/score") || code="000"
            runs=$((runs+1))
            scored=$(python3 -c "import json;print(json.load(open('/tmp/body.json')).get('summary',{}).get('scored',-1))" 2>/dev/null || echo "-1")
            echo "batch $runs: HTTP $code scored=$scored"
            if [ "$code" != "200" ]; then
              fails=$((fails+1))
              [ "$fails" -ge 3 ] && { echo "::error::3 consecutive failures"; exit 1; }
              sleep 20
              continue
            fi
            fails=0
            [ "$scored" = "0" ] && { echo "Queue empty."; break; }
            sleep 3
          done
          echo "Drained $runs batches."
