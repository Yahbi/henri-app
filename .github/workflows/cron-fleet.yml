# Cron fleet — scheduler of record for every Vercel cron endpoint that
# vercel.json cannot hold (Hobby plan caps native crons at 2: the Sunday
# refresh-zip-aggregates + synthesize-pre-intent pair stays in vercel.json).
#
# WHY THIS EXISTS: the previous external scheduler (Hetzner crontab) went
# silent on 2026-05-14, freezing scoring, ingest, licensing checks, digests
# and every sidecar refresh. GitHub Actions replaces it: free, observable
# (failed runs email the repo owner), and versioned with the code.
#
# The schedule table below reproduces the last full vercel.json cron map
# (commit 9bc76b3, 2026-05-02) verbatim, minus:
#   - score                → cron-score.yml (every 20 min)
#   - refresh-zip-aggregates / synthesize-pre-intent → still native in vercel.json
#   - cdc-svi / census-acs / hmda-rotate / hud-zipxw / code-violations /
#     nifc-wildfires      → intentionally parked (migration 00079 prune)
#
# Mechanics: the workflow wakes hourly at :00 and :30 and fires whichever
# endpoints are due at that UTC slot. GH Actions schedules can drift by
# minutes under load — fine for daily jobs. Each endpoint is idempotent
# and CRON_SECRET-gated; a non-200 marks the workflow run failed (which
# doubles as the outage alert that was missing when the old scheduler died).
#
# Manual runs: workflow_dispatch with `endpoints` (comma-separated route
# names, e.g. "scrape,enrich") fires those immediately regardless of slot.

name: cron-fleet

on:
  # 2026-08-05 incident, kept here because the shape of it is easy to repeat:
  # Supabase exhausted its Disk IO Budget ("Your instance may become
  # unresponsive" — their words, emailed 18:05 UTC 08-04) and every endpoint
  # began hanging rather than failing. With --max-time 290 --retry 2 per
  # endpoint, one run held the database for 20-30 minutes, and the next run
  # started 30 minutes later, so the load was effectively continuous on an
  # instance with no IO left. The run history shows it exactly: #1045-#1057
  # took 4-12 SECONDS, #1058 took 15m, #1059-#1068 took 21-30m and all failed.
  # The scheduler had become the reason the database could not recover.
  #
  # The schedules below stay ON. The fix is the circuit breaker in the run
  # step: it probes /api/health first and exits 0 without firing anything if
  # the backend is unhealthy, so a run during an outage costs ~25 seconds
  # instead of half an hour. That is strictly better than pausing, which
  # needs a human to remember to switch it back on; this resumes by itself.
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      endpoints:
        description: "Comma-separated cron route names to fire now (e.g. scrape,enrich,license-check)"
        required: false
        default: ""

# ONE GROUP PER SCHEDULE, not one group for the whole workflow.
#
# The old value was a single `group: cron-fleet` shared by both the :00 and
# the :30 schedule. GitHub's queue for a group with `cancel-in-progress:
# false` holds exactly ONE pending run: when a third arrival lands, the
# pending one is CANCELLED to make room. A cancelled run reports at run level
# as a failure and emails the repo owner, and its signature is unmistakable —
# zero steps executed, job conclusion `cancelled`, ~16 minutes queued. Those
# were the majority of the failure emails: roughly ten a day for runs that
# never executed a single line, which buried the handful that were real.
#
# Keying the group on the schedule means the :00 and :30 fires never contend
# with each other at all — only a :00 run can queue behind another :00 run,
# and those are an hour apart against `timeout-minutes: 30`. So the window in
# which a run can still be occupying the group when the next one arrives goes
# from 30 minutes to zero of EXECUTION time. `workflow_dispatch` gets its own
# group for the same reason (`github.event.schedule` is empty for a manual
# run).
#
# Not a total guarantee, and worth saying plainly: `timeout-minutes` does not
# cover time spent waiting for a runner. If GitHub starves this repo of
# runners for more than an hour, a queued run can still be sitting in the
# group when the next hour's fires, and the one after that would cancel it.
# That needs an hour of starvation where the old shared group needed
# thirty minutes with two schedules feeding it — the observed cancellations
# had ~16 minutes queued, which the split removes.
#
# There is no in-workflow way to "exit 0 because superseded": GitHub cancels a
# pending run BEFORE any step runs, so no step can observe it. Not queueing is
# the only fix available.
concurrency:
  group: cron-fleet-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fire due endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCED: ${{ github.event.inputs.endpoints }}
        run: |
          set -uo pipefail
          BASE="https://meethenri.com/api/cron"

          # ── CIRCUIT BREAKER ────────────────────────────────────────────
          # Added 2026-08-05 after this fleet turned a database outage into a
          # much worse one.
          #
          # What happened: Supabase exhausted its Disk IO Budget and the
          # instance stopped responding. Every endpoint below then hung
          # instead of answering. With --max-time 290 --retry 2 per endpoint
          # and a dozen endpoints due, a single run held the database for
          # 20-30 minutes — and the next run started 30 minutes later, so the
          # load was effectively CONTINUOUS on an instance that had no IO left
          # to serve it. The run history shows the transition exactly:
          # runs #1045-#1057 took 4-12 SECONDS; #1058 took 15m; #1059-#1068
          # took 21-30m each and all failed. The fleet could not recover
          # because the fleet was what prevented recovery.
          #
          # So: probe /api/health first. It is the right gate for this —
          # it exercises the app -> database path with an ESTIMATED head
          # count (pg_class.reltuples, not a scan, so it stays fast even on
          # a 2.25M-row table), and it returns 503 ONLY when the database
          # path is down. Merely-degraded auxiliary services (Stripe, Twilio,
          # Resend unconfigured) still return 200, so this cannot false-trip
          # on an unset optional env var and silently stop the whole fleet.
          #
          # exit 0, not 1, is deliberate. A red run here is not actionable —
          # it says "the database is down", which the operator already knows
          # from Supabase's own alerting, and one failure per 30 minutes
          # buries real alerts under noise. The skip is loud in the log and
          # in the step summary instead.
          # RETRY, added 2026-08-05 (same day, second incident). The single-shot
          # version of this probe cost ~9 hours of ingest on its first day.
          #
          # /api/health runs on a Vercel lambda that cold-starts. A cold start
          # opens a NEW database connection, and the first query on a cold
          # connection to a busy instance can take 15-20s — the failing run at
          # 18:15 reported latency_ms 19723 with uptime_seconds 19, i.e. the
          # probe WAS the first request that container ever served. Fourteen
          # minutes later the same endpoint answered in 110ms. Nothing about
          # the database had changed; the probe had simply paid the cold-start
          # cost and attributed it to Supabase.
          #
          # One slow sample is therefore not evidence of an outage, but the
          # old code treated it as proof and skipped the entire slot. Three
          # samples with backoff distinguishes the two cases that matter: a
          # cold container (first fails, second succeeds — proceed) from a
          # genuinely down backend (all three fail — skip, which is the
          # behaviour the breaker exists for and is preserved exactly).
          HEALTH_CODE="000"
          for attempt in 1 2 3; do
            HEALTH_CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
              --max-time 30 \
              "https://meethenri.com/api/health" 2>/dev/null) || HEALTH_CODE="000"
            echo "health probe attempt $attempt -> HTTP $HEALTH_CODE"
            head -c 300 /tmp/health.json 2>/dev/null || true
            echo
            [ "$HEALTH_CODE" = "200" ] && break
            # Don't sleep after the last attempt — it only delays the skip.
            [ "$attempt" -lt 3 ] && sleep 15
          done

          if [ "$HEALTH_CODE" != "200" ]; then
            echo "::warning::Backend unhealthy (HTTP $HEALTH_CODE after 3 attempts) — firing NOTHING this slot."
            {
              echo "### cron-fleet skipped"
              echo ""
              echo "Health probe returned **HTTP $HEALTH_CODE** on all 3 attempts,"
              echo "so no endpoints were fired."
              echo ""
              echo "This is the circuit breaker, not a cron bug. Firing into an"
              echo "unresponsive backend is what amplified the 2026-08-05 outage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          HH=$(date -u +%H)
          MM_RAW=$(date -u +%M)
          DOW=$(date -u +%w)   # 0 = Sunday
          # Snap actual start minute to the intended :00 / :30 slot
          # (GH Actions drifts; a 00:07 start still means the :00 slot).
          if [ "$MM_RAW" -lt 30 ]; then MM=00; else MM=30; fi
          SLOT="$HH:$MM"
          echo "UTC slot $SLOT dow=$DOW (actual $(date -u +%H:%M))"

          due=()
          if [ -n "$FORCED" ]; then
            IFS=',' read -ra parts <<< "$FORCED"
            for p in "${parts[@]}"; do due+=("$(echo "$p" | xargs)"); done
          else
            case "$SLOT" in
              00:00) due+=(openfema-ia) ;;
              00:30) due+=(state-licenses-rotate) ;;
              02:00) due+=(cron-runs-cleanup) ;;
              02:30) ;;
              03:00) due+=(engagement) ;;
              03:30) due+=(re-enrich) ;;
              04:00) due+=(zip-demand) ;;
              04:30) due+=(market-intel) ;;
              05:00) due+=(billing-sync)
                     [ "$DOW" = "0" ] && due+=(predictive-refresh) ;;
              06:00) due+=(license-check) ;;
              07:00) due+=(digest activate-arcgis-sources) ;;
              08:00) [ "$DOW" = "1" ] && due+=(weekly-digest weekly-briefing) ;;
              09:00) due+=(storm-events) ;;
              10:00) due+=(review-requests) ;;
              11:00) due+=(follow-ups) ;;
              12:00) due+=(permits) ;;
              13:00) due+=(enrich) ;;
              13:30) due+=(enrich) ;;
              14:00) due+=(enrich) ;;
              # geocode-backfill was removed from this slot 2026-08-06.
              #
              # Measured over 2026-08-04..06 it spent 281 seconds — one second
              # under the 290s curl ceiling — to read 250 permits and write
              # ZERO coordinates, every single run. Two independent reasons,
              # and neither is fixable in a slot:
              #
              #   1. It geocodes through Nominatim at the policy-mandated
              #      1 req/sec, so 250 rows IS 275 seconds by construction.
              #      /api/cron/census-geocode does the same job through the
              #      free Census BATCH endpoint at 5,000 rows/run and fires
              #      hourly at :00 (17/17 successful in the same window).
              #   2. Its candidate query has no ordering and no attempt
              #      marker, so it re-reads the same head of the same filtered
              #      set forever. Because it fills nothing, nothing drops out
              #      of the filter, so every run re-attempts the identical 250
              #      rows. census-geocode has `geocode_attempted_at`
              #      (migration 00134) precisely so it does not do this.
              #
              # The route stays on disk and stays in the admin trigger
              # allow-list, so it can still be fired by hand. Re-enable by
              # restoring `geocode-backfill` to this slot and to CADENCE_H in
              # src/app/api/cron/catchup/route.ts.
              14:30) due+=(enrich) ;;
              15:00) due+=(blast-worker) ;;
              16:30) due+=(courtlistener-liens) ;;
              17:00) due+=(usgs-quakes) ;;
              18:00) [ "$DOW" = "0" ] && due+=(hud-reo) ;;
              # census-geocode moved to the hourly block below — a daily slot
              # could not keep up with the ZIP backlog. Slot left empty
              # deliberately rather than refilled.
              19:00) ;;
              20:00) [ "$DOW" = "0" ] && due+=(fema-nri) ;;
              22:00) due+=(openfema-declarations) ;;
              22:30) due+=(gdelt-triggers) ;;
              23:00) due+=(swdi-events) ;;
              23:30) due+=(openfema-nfip) ;;
            esac

            # Permit ingest runs EVERY hour at :30 (2026-06-09 starvation
            # fix): 24 runs/day x 50 sources = 1,200 source-scrapes/day,
            # paired with the two-lane producer/explorer rotation in
            # sources-db.ts. The old daily run at 02:00 gave a 240-day
            # full rotation across ~12k enabled sources.
            if [ "$MM" = "30" ]; then due+=(scrape); fi

            # Nationwide source discovery runs EVERY hour at :00 — walks
            # one page of the Socrata Discovery + ArcGIS Hub catalogs per
            # run, auto-maps and ingests new permit datasets, and re-sweeps
            # forever (see /api/cron/discover-sources). This is the loop
            # that grows coverage toward every municipality that publishes
            # open permit data, then keeps watching for new ones.
            if [ "$MM" = "00" ]; then due+=(discover-sources); fi

            # ZIP backfill runs EVERY hour at :00 (was once daily at 19:00).
            #
            # This is the top of the lead funnel, not a map nicety. A permit
            # with a NULL zip can never become a lead for anyone, because the
            # score cron's lead-build loop does `if (!zip) continue`. Measured
            # 2026-08-05: 1,484,130 of 2,323,156 permits (63.9%) have no ZIP,
            # and 957,520 of those have a geocodable street address.
            #
            # At the old cadence — one run a day, 5,000 permits a run — that
            # backlog needed ~191 days to clear. Hourly clears it in ~8. The
            # Census batch geocoder is free, needs no key and publishes no
            # rate limit, so the only real cost is our own function time, and
            # each run is hard-bounded at MAX_PER_RUN.
            if [ "$MM" = "00" ]; then due+=(census-geocode); fi

            # Territory backfill, every 2 hours.
            #
            # Permits are considered for lead creation exactly once, when
            # they are first scored, and are dropped with no `else` branch if
            # their ZIP was unclaimed at that moment. So territory bought
            # today delivers none of the permits already sitting in it: ZIP
            # 28269 held 15,112 permits and 0 leads. This re-queues those
            # orphans so the scorer can convert them. Cheap no-op when every
            # claimed ZIP is already fully converted, which is the steady
            # state — it only does work after a new claim.
            if [ "$MM" = "00" ] && [ $((10#$HH % 2)) -eq 0 ]; then due+=(territory-backfill); fi

            # Catch-up self-heal (2026-06-10): GH throttles the fleet, so a
            # once-daily slot can be missed for days (audit found 5 data
            # crons frozen ~4 weeks). The catchup endpoint reads cron_runs
            # and re-fires any tracked data cron past its cadence — runs
            # EVERY fleet fire so starvation self-corrects within hours.
            due+=(catchup)
          fi

          if [ "${#due[@]}" -eq 0 ]; then
            echo "Nothing due this slot."
            exit 0
          fi

          failed=0
          consecutive=0
          for ep in "${due[@]}"; do
            echo "── $ep ──"
            # --retry removed. Retrying a request that timed out because the
            # database is saturated just multiplies the load that caused the
            # timeout; the endpoints are idempotent and the next slot (or
            # /api/cron/catchup) re-fires anything that was missed, so a retry
            # here buys nothing and costs three times the IO.
            code=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
              --max-time 290 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE/$ep") || code="000"
            echo "HTTP $code"
            head -c 600 /tmp/body.json || true
            echo

            if [ "$code" = "200" ]; then
              consecutive=0
            else
              echo "::error::$ep returned HTTP $code"
              failed=1
              consecutive=$((consecutive + 1))
              # Two in a row means the backend went down mid-run, not that one
              # endpoint is broken. Keep going and this run spends 290s per
              # remaining endpoint hammering something that cannot answer —
              # which is exactly how a 4-second run became a 30-minute one.
              if [ "$consecutive" -ge 2 ]; then
                echo "::warning::2 consecutive failures — backend appears down. Abandoning the remaining endpoints this slot."
                {
                  echo "### cron-fleet aborted mid-run"
                  echo ""
                  echo "Two consecutive endpoint failures, so the rest of the slot was skipped."
                  echo "Endpoints are idempotent and catchup re-fires whatever was missed."
                } >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            fi
            sleep 3
          done
          exit "$failed"
