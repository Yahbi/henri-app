name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint --max-warnings=0)
        run: pnpm lint --max-warnings=0

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Truthfulness scan (CLAUDE.md contract)
        # Hard-fails on fabricated metrics or forged plan prices.
        # See scripts/truthfulness-scan.ts + .claude/commands/truthfulness-scan.md.
        run: pnpm truthfulness

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://meethenri.com
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.placeholder

  e2e:
    # P1-14 — Playwright E2E in CI. Runs against a freshly-built local
    # server on each PR. We don't need real Supabase / Stripe / Twilio
    # for the marketing + auth + 404 paths; placeholder env vars match
    # what the build job uses. Tests that depend on a real DB live
    # behind an `e2e:integration` filter and aren't run here.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (placeholder env)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.placeholder

      - name: Run Playwright E2E
        # `pnpm e2e` invokes `playwright test`. The playwright config
        # auto-starts `next start` on port 3000 via the webServer block.
        run: pnpm e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.placeholder

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
